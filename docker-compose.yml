services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab07
      POSTGRES_USER: lab07
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab07-db-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab07 -d lab07"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - lab07_postgres:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:-lab07-cambie-esta-clave}
      JWT_SECRET: ${JWT_SECRET:-techstore-jwt-cambie-esta-clave-de-32-caracteres}
      DATABASE_URL: postgresql://lab07:${POSTGRES_PASSWORD:-lab07-db-password}@db:5432/lab07
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/auth/github/callback}
      GITHUB_DEFAULT_STORE: ${GITHUB_DEFAULT_STORE:-TechStore Lima Centro}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
      GOOGLE_DEFAULT_STORE: ${GOOGLE_DEFAULT_STORE:-TechStore Lima Centro}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  lab07_postgres:
